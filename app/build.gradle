plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    // ics-openvpn engine code imports de.blinkt.openvpn.R / BuildConfig,
    // so the resource namespace is the engine one; the applicationId stays ours.
    namespace 'de.blinkt.openvpn'
    compileSdk 34

    defaultConfig {
        applicationId "com.vpngate.companion"
        minSdk 23
        targetSdk 34
        versionCode 6
        versionName "2.3"
        buildConfigField "boolean", "openvpn3", "false"
    }

    signingConfigs {
        appSign {
            storeFile file("signing/release.keystore")
            storePassword "vpngate2026"
            keyAlias "vpngate"
            keyPassword "vpngate2026"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.appSign
        }
        release {
            signingConfig signingConfigs.appSign
            minifyEnabled false
            shrinkResources false
        }
    }

    buildFeatures {
        buildConfig true
        aidl true
    }

    packaging {
        jniLibs {
            // OpenVPN 2 binary must be extractable to nativeLibraryDir for exec()
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += "-opt-in=kotlin.io.encoding.ExperimentalEncodingApi"
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.annotation:annotation:1.8.2'
}
