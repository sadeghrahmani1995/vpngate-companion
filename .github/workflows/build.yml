name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk VpngateCompanion.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vpngate-companion-apk
          path: VpngateCompanion.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "دستیار VPN Gate — بیلد ${{ github.run_number }}"
          files: VpngateCompanion.apk
          body: "APK خروجی بیلد خودکار. برای نصب، اجازهٔ «نصب از منابع ناشناس» را بدهید. پیش‌نیاز: اپ OpenVPN for Android."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
