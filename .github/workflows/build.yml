name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK (release, signed with stable key)
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk VpngateCompanion.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vpngate-companion-apk
          path: VpngateCompanion.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "دستیار VPN Gate 2.0 — بیلد ${{ github.run_number }}"
          files: VpngateCompanion.apk
          body: |
            نسخهٔ ۲.۰ — اپ کاملاً مستقل:
            - موتور OpenVPN داخلی (بدون نیاز به OpenVPN for Android)
            - دریافت خودکار لیست سرورهای VPN Gate (۴ منبع، با ریدایرکت)
            - تست TCP پورت سرورها و انتخاب سریع‌ترین
            - اتصال خودکار + failover (در صورت قطعی، سرور بعدی)
            - امضای ثابت: از این به بعد آپدیت‌ها بدون حذف برنامه نصب می‌شوند

            نکتهٔ نصب: اگر نسخهٔ قبلی را نصب دارید، اول آن را Uninstall کنید (فقط یک بار).
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
